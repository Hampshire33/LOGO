# PileBuild AI server. Deployed by .github/workflows/worker.yml; the API key is a secret
# (ANTHROPIC_API_KEY), never in this file.
name = "pilebuild-ai"
main = "index.js"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://hampshire33.github.io"
# Measured on the test bench (tools/eval): Opus 5.5 identified parts+colours about twice as well
# as Sonnet 5 (spread 91% vs 47%, carpet 78% vs 34%) at ~3x the cost (~23 vs ~7 US cents a photo).
MODEL = "claude-opus-5-5"
# Daily caps in photo reads (a small photo is 1 read; a busy phone photo 1 overview + up to 9 tiles).
# At ~5-25 US cents a read with Opus 5.5, 200 reads a day is at most ~$50: set your console spend limit too.
PER_IP_DAILY = "20"
DAILY_TILES = "200"

# The deploy workflow creates the LIMITS namespace and fills in its id below.
# [[kv_namespaces]]
# binding = "LIMITS"
# id = ""
