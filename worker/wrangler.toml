# PileBuild AI server. Deployed by .github/workflows/worker.yml; the API key is a secret
# (ANTHROPIC_API_KEY), never in this file.
name = "pilebuild-ai"
main = "index.js"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://hampshire33.github.io"
# Default reader: Sonnet 5 ($2/$10 per million tokens). "Precise read" on the page uses
# PRECISE_MODEL ($4/$20, about twice as accurate on the test bench, see EVAL-RESULTS.md) and
# counts as 3 reads against the caps. Set ALLOW_PRECISE = "0" to switch precise reads off.
MODEL = "claude-sonnet-5"
PRECISE_MODEL = "claude-opus-5-5"
ALLOW_PRECISE = "1"
# AI designs (the "Design with AI" button): several long answers each, about 5-25 US cents.
DESIGN_MODEL = "claude-opus-5-5"
# Daily caps in photo reads (a small photo is 1 read; a busy phone photo 1 overview + up to 9 tiles).
# At ~5-25 US cents a read with Opus 5.5, 200 reads a day is at most ~$50: set your console spend limit too.
PER_IP_DAILY = "60"
DAILY_TILES = "200"
# Change to reset today's counters (e.g. after testing).
LIMIT_EPOCH = "2"

# The deploy workflow creates the LIMITS namespace and fills in its id below.
# [[kv_namespaces]]
# binding = "LIMITS"
# id = ""
