name: Deploy site

# Builds PileBuild and publishes it to GitHub Pages on every push to main.
#   /            PileBuild app (photo of loose bricks -> parts, ideas, instructions)
#   /player.html the booklet player for the ready-made models
#   /mosaic.html photo -> LEGO mosaic in the browser

on:
  push:
    branches: [main]
  workflow_dispatch:
  # rebuild when the AI server is (re)deployed, to pick up its address
  workflow_run:
    workflows: ['Deploy AI server']
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check models
        run: |
          node tools/check-model.cjs cat
          node tools/check-model.cjs microduck
      - name: Build real-LEGO catalogue (Rebrickable)
        id: catalog
        continue-on-error: true
        run: node tools/catalog.cjs
      - name: Keep a copy of the catalogue on the catalog-data branch
        if: steps.catalog.outcome == 'success'
        run: |
          mkdir -p /tmp/cat && cp dist/catalog.json /tmp/cat/
          cd /tmp/cat
          git init -q -b catalog-data
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add catalog.json
          git commit -q -m "Catalogue from Rebrickable, $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" catalog-data
      - name: Build site
        run: |
          node tools/build-app.cjs
          mkdir -p _site
          cp dist/app.html _site/index.html
          if [ -f dist/catalog.json ]; then cp dist/catalog.json _site/catalog.json; fi
          # AI server address, if one has been deployed (see SETUP-AI.md)
          if git fetch -q origin site-config 2>/dev/null; then
            url=$(git show origin/site-config:ai-endpoint.txt | tr -d '[:space:]')
            echo "window.PILEBUILD_CONFIG = { aiEndpoint: '$url' };" > _site/config.js
            echo "AI server: $url"
          else
            echo "window.PILEBUILD_CONFIG = {};" > _site/config.js
          fi
          cp index.html _site/player.html
          cp mosaic.html _site/mosaic.html
          cp -r src _site/src
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
