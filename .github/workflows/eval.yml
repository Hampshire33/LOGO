name: Evaluate identification

# Scores how well photos are identified, on test scenes with known contents (and on your own
# photos in eval/photos/ if you add them with a truth.json). Run it from the Actions tab after
# changing the prompt, the tiling or the model, and compare the report with the last run.
# The Claude run needs the ANTHROPIC_API_KEY secret. With the defaults (Sonnet 5, 3 photos per
# kind = 12 photos) a run costs roughly 20-50 US cents; with claude-opus-5-5 about twice that.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Claude model
        default: claude-sonnet-5
      per_kind:
        description: Test photos per scene kind (spread, heap, carpet, dense)
        default: '3'

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Real-LEGO catalogue
        run: |
          mkdir -p dist
          git fetch -q origin catalog-data && git show origin/catalog-data:catalog.json > dist/catalog.json || echo "no catalogue yet"
      - name: Offline detector (baseline)
        run: node tools/eval/run.cjs --engine offline --per-kind ${{ inputs.per_kind }} --out dist/eval-offline.md
      - name: Claude reader
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::notice::Add the ANTHROPIC_API_KEY secret to score the Claude reader."; exit 0; fi
          node tools/eval/run.cjs --engine claude --model "${{ inputs.model }}" --per-kind ${{ inputs.per_kind }} --out dist/eval-claude.md
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: dist/eval-*.md
